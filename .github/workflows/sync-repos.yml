name: Sync GitHub Repos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/github.ts'
      - 'src/lib/config.mjs'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run sync:repos

      - name: Commit updated fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/repos-fallback.json
          git diff --quiet && echo "No changes" || (git commit -m "chore: sync repos fallback" && git push)
